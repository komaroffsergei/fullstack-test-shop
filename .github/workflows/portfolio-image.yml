name: Portfolio immutable image
on:
  push:
    branches: [portfolio/20260907]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/komaroffsergei/fullstack-test-shop:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
