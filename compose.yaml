services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shop -d shop']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - shop-postgres:/var/lib/postgresql/data

volumes:
  shop-postgres:
